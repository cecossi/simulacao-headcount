<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Headcount — Preâmbulo Tech</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --green-bg: #dcfce7; --green-text: #166534;
      --yellow-bg: #fef9c3; --yellow-text: #713f12;
      --red-bg: #fee2e2;   --red-text: #991b1b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; }

    .header { background: #0f172a; color: #f8fafc; padding: 18px 28px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    .header h1 { font-size: 17px; font-weight: 600; }
    .header span { font-size: 12px; color: #94a3b8; }

    .page { max-width: 1400px; margin: 0 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

    /* SUMMARY */
    .summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
    .summary-card .prod-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .summary-card .nums { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
    .summary-card .big { font-size: 24px; font-weight: 700; }
    .summary-card .arrow { font-size: 16px; color: var(--text-muted); }
    .summary-card .needed { font-size: 20px; font-weight: 700; }
    .summary-card .delta { font-size: 12px; font-weight: 600; margin-top: 4px; }
    .ok { color: #16a34a; } .warn { color: #d97706; } .crit { color: #dc2626; }

    /* CARD */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .card-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .card-head h2 { font-size: 14px; font-weight: 600; }
    .card-head .people { font-size: 11px; color: var(--text-muted); }
    .backlog-pill { margin-left: auto; font-size: 11px; background: #e2e8f0; padding: 2px 8px; border-radius: 10px; color: var(--text-muted); white-space: nowrap; }

    /* CONTROLS */
    .controls { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
    .ctrl-col { padding: 12px 16px; }
    .ctrl-col + .ctrl-col { border-left: 1px solid var(--border); }
    .ctrl-col-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 8px; }
    .ctrl-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .ctrl-row:last-child { margin-bottom: 0; }
    .ctrl-row label { font-size: 12px; color: var(--text-muted); white-space: nowrap; min-width: 160px; }
    .ctrl-row input[type=number] { width: 62px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; text-align: center; }
    .ctrl-row input[type=number]:focus { outline: 2px solid #3b82f6; border-color: transparent; }
    .cap-display { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .cap-display strong { color: var(--text); }
    .ctrl-note { font-size: 11px; color: #64748b; margin-top: 6px; line-height: 1.4; }

    .shared-note { font-size: 11px; color: #92400e; background: #fffbeb; padding: 5px 16px; border-bottom: 1px solid #fde68a; }

    /* TABLE */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead th { padding: 7px 12px; font-weight: 500; color: var(--text-muted); background: #f8fafc; border-bottom: 2px solid var(--border); text-align: right; white-space: nowrap; }
    thead th:first-child { text-align: left; }
    tbody td { padding: 6px 12px; text-align: right; border-bottom: 1px solid #f1f5f9; }
    tbody td:first-child { text-align: left; font-weight: 500; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f8fafc; }
    .section-row td { background: #e2e8f0; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #64748b; padding: 4px 12px; }
    .yr2027 td:first-child { color: #4f46e5; }

    .entry-inp { width: 54px; padding: 3px 5px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; font-size: 12px; background: #fffbeb; }
    .entry-inp:focus { outline: 2px solid #3b82f6; border-color: transparent; }

    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .g  { background: var(--green-bg);  color: var(--green-text); }
    .y  { background: var(--yellow-bg); color: var(--yellow-text); }
    .r  { background: var(--red-bg);    color: var(--red-text); }
    .hc-ok   { color: #16a34a; font-weight: 700; }
    .hc-warn { color: #d97706; font-weight: 700; }
    .hc-crit { color: #dc2626; font-weight: 700; }

    .card-foot { display: flex; gap: 20px; padding: 10px 16px; background: #f8fafc; border-top: 1px solid var(--border); flex-wrap: wrap; font-size: 12px; }
    .foot-item strong { font-weight: 600; }

    .legend { display: flex; gap: 12px; font-size: 11px; color: var(--text-muted); padding: 6px 16px; background: #f8fafc; border-top: 1px solid var(--border); }
    .legend span { display: flex; align-items: center; gap: 4px; }

    /* CURVE SECTION */
    .curve-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .curve-head { padding: 13px 16px; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .curve-head h2 { font-size: 14px; font-weight: 600; }
    .curve-head p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .curve-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
    .curve-chart { padding: 16px; }
    .curve-chart + .curve-chart { border-left: 1px solid var(--border); }
    .curve-chart-title { font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    .curve-legend { display: flex; gap: 12px; font-size: 11px; color: var(--text-muted); padding: 8px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .curve-legend span { display: flex; align-items: center; gap: 5px; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .curve-total { padding: 16px; border-bottom: 1px solid var(--border); }
    .curve-total-title { font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    .curve-divider { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #64748b; background: #e2e8f0; padding: 4px 16px; }
  </style>
</head>
<body>

<div class="header">
  <h1>Simulador de Headcount — Implementação</h1>
  <span>Preâmbulo Tech · Base: 16/10/2026 · Meta 2027: encerrar projetos em até 30 dias</span>
</div>

<div class="page">
  <div class="summary-bar" id="summary-bar"></div>
  <div id="curve-section"></div>
  <div id="products"></div>
</div>

<script>
Chart.register(ChartDataLabels);

const MONTHS = [
  { key:'2026-10', label:'Out/26', year:'2026', partial:true },
  { key:'2026-11', label:'Nov/26', year:'2026' },
  { key:'2026-12', label:'Dez/26', year:'2026' },
  { key:'2027-01', label:'Jan/27', year:'2027' },
  { key:'2027-02', label:'Fev/27', year:'2027' },
  { key:'2027-03', label:'Mar/27', year:'2027' },
  { key:'2027-04', label:'Abr/27', year:'2027' },
  { key:'2027-05', label:'Mai/27', year:'2027' },
  { key:'2027-06', label:'Jun/27', year:'2027' },
  { key:'2027-07', label:'Jul/27', year:'2027' },
  { key:'2027-08', label:'Ago/27', year:'2027' },
  { key:'2027-09', label:'Set/27', year:'2027' },
  { key:'2027-10', label:'Out/27', year:'2027' },
  { key:'2027-11', label:'Nov/27', year:'2027' },
  { key:'2027-12', label:'Dez/27', year:'2027' },
];

// throughput = fechamentos/pessoa/mês (calibrado no histórico real de encerrados)
// duracaoAtual = média histórica de dias (referência para a legenda da tabela 2026)
// duracaoMeta  = meta 2027 (referência para cor dos badges)
const S = {
  products: {
    'CPJ-3C': {
      color: '#4f46e5',
      headcount: 4,
      throughput: 4,
      duracaoAtual: 110,
      duracaoMeta: 30,
      backlog: 18,
      implementers: 'Claudine · Anna Flora · Matteus · Priscila',
      sharedNote: 'Matteus, Claudine e Priscila também atuam em Office ADV — alocação orgânica.',
      entries: {
        '2026-10': 5,  '2026-11': 8,  '2026-12': 5,
        '2027-01': 4,  '2027-02': 10, '2027-03': 13,
        '2027-04': 12, '2027-05': 11, '2027-06': 13,
        '2027-07': 9,  '2027-08': 13, '2027-09': 12,
        '2027-10': 11, '2027-11': 12, '2027-12': 6,
      }
    },
    'Office ADV': {
      color: '#059669',
      headcount: 5,
      throughput: 9,
      duracaoAtual: 71,
      duracaoMeta: 30,
      backlog: 40,
      implementers: 'Bárbara · Lara · Matteus · Claudine · Priscila',
      sharedNote: 'Matteus, Claudine e Priscila também atuam em CPJ-3C — alocação orgânica.',
      entries: {
        '2026-10': 10, '2026-11': 22, '2026-12': 14,
        '2027-01': 27, '2027-02': 33, '2027-03': 58,
        '2027-04': 55, '2027-05': 52, '2027-06': 58,
        '2027-07': 29, '2027-08': 58, '2027-09': 55,
        '2027-10': 52, '2027-11': 50, '2027-12': 16,
      }
    },
    'CPJ-Cobrança': {
      color: '#d97706',
      headcount: 1,
      throughput: 2,
      duracaoAtual: 66,
      duracaoMeta: 30,
      backlog: 8,
      implementers: 'Thiago',
      sharedNote: null,
      entries: {
        '2026-10': 1, '2026-11': 1, '2026-12': 1,
        '2027-01': 1, '2027-02': 1, '2027-03': 1,
        '2027-04': 1, '2027-05': 1, '2027-06': 1,
        '2027-07': 1, '2027-08': 1, '2027-09': 1,
        '2027-10': 1, '2027-11': 1, '2027-12': 1,
      }
    }
  }
};

/* ─── SIMULAÇÃO ─────────────────────────────────────────────── */
// Projetos que entram num mês não são concluídos no mesmo mês.
// Concluídos = min(estoque de abertura, capacidade).
// Entradas chegam no mês mas só são processadas a partir do próximo.
//
// Tempo médio (Lei de Little): estoque_final / capacidade × 30 dias.
// Representa quantos dias um projeto que entra agora vai esperar até
// ser concluído, dado o tamanho atual da fila.
function simulate(name) {
  const p = S.products[name];
  const rows = [];
  let stock = p.backlog;

  for (const m of MONTHS) {
    const entries  = p.entries[m.key] || 0;
    const cap      = p.headcount * p.throughput;
    const done     = Math.min(stock, cap);
    const stockOut = stock - done + entries;
    // dias que um projeto na fila atual vai esperar
    const avgDays  = cap > 0 ? Math.round((stockOut / cap) * 30) : 9999;
    // HC mínimo para que o estoque final caiba em 1 mês de capacidade
    const hcMin    = cap > 0 ? Math.ceil(stockOut / p.throughput) : '—';
    const dur      = m.year === '2027' ? p.duracaoMeta : p.duracaoAtual;

    rows.push({ m, entries, stockIn: stock, cap, done, stockOut, avgDays, hcMin, dur });
    stock = stockOut;
  }
  return rows;
}

/* ─── UTILITÁRIOS ───────────────────────────────────────────── */
function timeBadge(d, meta) {
  if (d >= 9999) return '<span class="badge r">∞</span>';
  const cls = d <= meta ? 'g' : d <= meta * 2 ? 'y' : 'r';
  return `<span class="badge ${cls}">${d}d</span>`;
}
function hcCell(needed, current) {
  if (needed === '—') return '—';
  if (needed <= current)      return `<span class="hc-ok">${needed}</span>`;
  if (needed === current + 1) return `<span class="hc-warn">${needed}</span>`;
  return `<span class="hc-crit">${needed}</span>`;
}

/* ─── HEADCOUNT ESTÁVEL ─────────────────────────────────────── */
// Encontra o menor HC que mantém o sistema estável em 2027:
// hcMin nunca supera o HC testado em nenhum mês do ano.
// Isso evita o efeito de "acúmulo fictício" que ocorre quando
// a simulação roda com HC insuficiente e o estoque cresce indefinidamente.
function findStableHC(name) {
  const p = S.products[name];
  for (let tryHC = 1; tryHC <= 60; tryHC++) {
    let stock = p.backlog;
    let stable = true;
    for (const m of MONTHS) {
      const entries  = p.entries[m.key] || 0;
      const cap      = tryHC * p.throughput;
      const done     = Math.min(stock, cap);
      const stockOut = stock - done + entries;
      if (m.year === '2027' && Math.ceil(stockOut / p.throughput) > tryHC) {
        stable = false; break;
      }
      stock = stockOut;
    }
    if (stable) return tryHC;
  }
  return 60;
}

/* ─── CONFIG CHART ──────────────────────────────────────────── */
const DATALABELS_BAR = {
  display: ctx => ctx.datasetIndex === 0 && ctx.dataset.data[ctx.dataIndex] > 0,
  anchor: 'end',
  align: 'end',
  offset: 2,
  font: { size: 10, weight: '700' },
  color: '#0f172a',
  formatter: v => v,
};

const CHART_OPTIONS = (yMax) => ({
  responsive: true,
  plugins: {
    legend: { display: false },
    datalabels: DATALABELS_BAR,
  },
  layout: { padding: { top: 18 } },
  scales: {
    y: {
      beginAtZero: true,
      ...(yMax ? { max: yMax + 2 } : {}),
      ticks: { stepSize: 1, precision: 0 },
      title: { display: true, text: 'pessoas', font: { size: 11 } },
    },
    x: { ticks: { font: { size: 10 } } },
  },
});

/* ─── RENDER CURVE ──────────────────────────────────────────── */
const _charts = {};
function renderCurve() {
  const names = Object.keys(S.products);
  const section = document.getElementById('curve-section');
  const totalHC    = Object.values(S.products).reduce((s,p) => s + p.headcount, 0);
  const totalStable = Object.keys(S.products).reduce((s,n) => s + findStableHC(n), 0);
  section.innerHTML = `
    <div class="curve-section">
      <div class="curve-head">
        <h2>Curva de HC necessário — mês a mês</h2>
        <p>Quantas pessoas são necessárias em cada mês para manter a fila sob controle. A linha tracejada é o headcount atual.</p>
      </div>
      <div class="curve-total">
        <div class="curve-total-title">Total — todos os produtos · atual: ${totalHC} pessoas · necessário: ${totalStable} pessoas · <span class="${totalStable > totalHC ? 'crit' : 'ok'}">▲ ${totalStable - totalHC} a contratar</span></div>
        <canvas id="cv-total" style="max-height:180px"></canvas>
      </div>
      <div class="curve-divider">Por produto</div>
      <div class="curve-grid">
        ${names.map(n => `<div class="curve-chart"><div class="curve-chart-title" style="color:${S.products[n].color}">${n}</div><canvas id="cv-${n.replace(/\W/g,'_')}"></canvas></div>`).join('')}
      </div>
      <div class="curve-legend">
        <span><span class="swatch" style="background:#16a34a"></span>Dentro do headcount atual</span>
        <span><span class="swatch" style="background:#d97706"></span>+1 pessoa</span>
        <span><span class="swatch" style="background:#dc2626"></span>+2 ou mais</span>
        <span style="margin-left:4px">— — headcount atual</span>
      </div>
    </div>`;

  // Gráfico total
  // Simula cada produto com o HC estável (não o atual) para o gráfico total
  // mostrar a demanda real mês a mês, sem o acúmulo fictício de estoque.
  const allStableRows = names.map(n => {
    const p = S.products[n];
    const saved = p.headcount;
    p.headcount = findStableHC(n);
    const rows = simulate(n);
    p.headcount = saved;
    return rows;
  });
  const totalLabels = allStableRows[0].map(r => r.m.label);
  const totalData = totalLabels.map((_, i) =>
    names.reduce((s, n, ni) => {
      const hc = allStableRows[ni][i].hcMin;
      return s + (typeof hc === 'number' ? hc : 0);
    }, 0)
  );
  const totalCurrentHC = Object.values(S.products).reduce((s,p) => s + p.headcount, 0);
  const totalColors = totalData.map(v =>
    v <= totalCurrentHC ? '#16a34a' : v === totalCurrentHC + 1 ? '#d97706' : '#dc2626'
  );
  if (_charts['cv-total']) _charts['cv-total'].destroy();
  _charts['cv-total'] = new Chart(document.getElementById('cv-total').getContext('2d'), {
    data: {
      labels: totalLabels,
      datasets: [
        {
          type: 'bar',
          label: 'HC total necessário',
          data: totalData,
          backgroundColor: totalColors,
          borderRadius: 3,
          order: 2,
        },
        {
          type: 'line',
          label: 'HC total atual',
          data: Array(totalLabels.length).fill(totalCurrentHC),
          borderColor: '#0f172a',
          borderWidth: 2,
          borderDash: [6, 3],
          pointRadius: 0,
          fill: false,
          order: 1,
        }
      ]
    },
    options: CHART_OPTIONS(Math.max(...totalData)),
  });

  names.forEach(name => {
    const p = S.products[name];
    const rows = simulate(name);
    const labels = rows.map(r => r.m.label);
    const hcData = rows.map(r => typeof r.hcMin === 'number' ? r.hcMin : 0);
    const colors = hcData.map(v =>
      v <= p.headcount ? '#16a34a' : v === p.headcount + 1 ? '#d97706' : '#dc2626'
    );
    const id = 'cv-' + name.replace(/\W/g,'_');
    if (_charts[id]) { _charts[id].destroy(); }
    const ctx = document.getElementById(id).getContext('2d');
    _charts[id] = new Chart(ctx, {
      data: {
        labels,
        datasets: [
          {
            type: 'bar',
            label: 'HC necessário',
            data: hcData,
            backgroundColor: colors,
            borderRadius: 3,
            order: 2,
          },
          {
            type: 'line',
            label: 'HC atual',
            data: Array(rows.length).fill(p.headcount),
            borderColor: '#0f172a',
            borderWidth: 2,
            borderDash: [6, 3],
            pointRadius: 0,
            fill: false,
            order: 1,
          }
        ]
      },
      options: CHART_OPTIONS(Math.max(...hcData)),
    });
  });
}

/* ─── RENDER SUMMARY ────────────────────────────────────────── */
function renderSummary() {
  document.getElementById('summary-bar').innerHTML = Object.keys(S.products).map(name => {
    const p = S.products[name];
    const rows = simulate(name);
    const r27 = rows.filter(r => r.m.year === '2027');
    const avgDays27 = Math.round(r27.reduce((s,r) => s + Math.min(r.avgDays, 999), 0) / r27.length);
    const stableHC = findStableHC(name);
    const delta = stableHC - p.headcount;
    const cls = delta > 0 ? 'crit' : 'ok';
    const deltaLabel = delta > 0 ? `▲ ${delta} a contratar` : `✓ suficiente`;
    return `
      <div class="summary-card">
        <div class="prod-label" style="color:${p.color}">${name}</div>
        <div class="nums">
          <span class="big">${p.headcount}</span>
          <span class="arrow">→</span>
          <span class="needed ${cls}">${stableHC}</span>
          <span style="font-size:11px;color:var(--text-muted)">necessário</span>
        </div>
        <div class="delta ${cls}">${deltaLabel}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Tempo médio 2027: <strong style="color:var(--text)">${avgDays27}d</strong></div>
      </div>`;
  }).join('');
}

/* ─── RENDER PRODUCT ────────────────────────────────────────── */
function renderProduct(name) {
  const p = S.products[name];
  const rows = simulate(name);
  const r27 = rows.filter(r => r.m.year === '2027');
  const avgDays27 = Math.round(r27.reduce((s,r) => s + Math.min(r.avgDays, 999), 0) / r27.length);
  const stableHC  = findStableHC(name);
  const delta = stableHC - p.headcount;
  const cap = p.headcount * p.throughput;

  let prevYear = '';
  const tRows = rows.map(r => {
    const sep = r.m.year !== prevYear
      ? `<tr class="section-row"><td colspan="8">${
          r.m.year === '2026'
            ? `2026 — duração média atual: ${p.duracaoAtual}d (referência histórica)`
            : `2027 — meta: ${p.duracaoMeta}d por projeto — badge verde = dentro da meta`
        }</td></tr>`
      : '';
    prevYear = r.m.year;
    const partialTip = r.m.partial ? ' <span style="font-size:10px;color:#94a3b8">(~15 dias)</span>' : '';
    const rowClass = r.m.year === '2027' ? ' class="yr2027"' : '';
    return `${sep}
      <tr${rowClass}>
        <td>${r.m.label}${partialTip}</td>
        <td>${r.stockIn}</td>
        <td><input class="entry-inp" type="number" min="0" value="${r.entries}"
              oninput="setEntry('${name}','${r.m.key}',this.value)"></td>
        <td>${r.cap}</td>
        <td>${r.done}</td>
        <td>${r.stockOut}</td>
        <td>${timeBadge(r.avgDays, r.dur)}</td>
        <td>${hcCell(r.hcMin, p.headcount)}</td>
      </tr>`;
  }).join('');

  const deltaLabel = delta > 0
    ? `<span class="crit">▲ ${delta} a contratar no pico</span>`
    : `<span class="ok">✓ headcount suficiente</span>`;

  const id = name.replace(/\W/g,'_');
  return `
    <div class="card" id="card-${id}">
      <div class="card-head">
        <div class="dot" style="background:${p.color}"></div>
        <div>
          <h2>${name}</h2>
          <div class="people">${p.implementers}</div>
        </div>
        <div class="backlog-pill">Estoque atual: ${p.backlog} projetos</div>
      </div>

      <div class="controls">
        <div class="ctrl-col" style="background:#f8fafc;">
          <div class="ctrl-col-label">Parâmetros</div>
          <div class="ctrl-row">
            <label>Implementadores</label>
            <input type="number" min="0" max="30" value="${p.headcount}"
                   oninput="setConf('${name}','headcount',this.value)">
          </div>
          <div class="ctrl-row">
            <label>Projetos/pessoa/mês</label>
            <input type="number" min="1" max="50" value="${p.throughput}"
                   oninput="setConf('${name}','throughput',this.value)">
          </div>
          <div class="ctrl-row">
            <label>Meta de duração 2027 (dias)</label>
            <input type="number" min="1" max="999" value="${p.duracaoMeta}"
                   oninput="setConf('${name}','duracaoMeta',this.value)">
          </div>
          <div class="cap-display">Capacidade: <strong>${cap} projetos/mês</strong></div>
          <div class="ctrl-note">Throughput calibrado no histórico real de encerrados.<br>Duração histórica atual: <strong>${p.duracaoAtual}d</strong></div>
        </div>
      </div>

      ${p.sharedNote ? `<div class="shared-note">${p.sharedNote}</div>` : ''}

      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th style="text-align:left">Mês</th>
              <th>Estoque inicial</th>
              <th>Entradas</th>
              <th>Capacidade</th>
              <th>Concluídos</th>
              <th>Estoque final</th>
              <th>Tempo médio</th>
              <th>HC mínimo</th>
            </tr>
          </thead>
          <tbody>${tRows}</tbody>
        </table>
      </div>

      <div class="card-foot">
        <div class="foot-item">Tempo médio em 2027: <strong>${avgDays27}d</strong></div>
        <div class="foot-item">HC estável necessário: <strong>${stableHC}</strong> vs <strong>${p.headcount} atuais</strong> — ${deltaLabel}</div>
      </div>
      <div class="legend">
        <span><span class="badge g" style="font-size:10px">verde</span> dentro da meta (≤ ${p.duracaoMeta}d em 2027)</span>
        <span><span class="badge y" style="font-size:10px">amarelo</span> até 2× a meta</span>
        <span><span class="badge r" style="font-size:10px">vermelho</span> acima de 2× a meta</span>
      </div>
    </div>`;
}

/* ─── INTERAÇÃO ─────────────────────────────────────────────── */
function setEntry(name, key, val) {
  S.products[name].entries[key] = parseInt(val) || 0;
  rerender();
  requestAnimationFrame(() => {
    const idx = MONTHS.findIndex(m => m.key === key);
    const inputs = document.querySelectorAll(`#card-${name.replace(/\W/g,'_')} .entry-inp`);
    if (inputs[idx]) inputs[idx].focus();
  });
}
function setConf(name, field, val) {
  S.products[name][field] = parseInt(val) || 0;
  rerender();
}
function rerender() {
  renderSummary();
  renderCurve();
  document.getElementById('products').innerHTML =
    Object.keys(S.products).map(renderProduct).join('');
}

rerender();
</script>
</body>
</html>
