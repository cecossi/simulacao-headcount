<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Headcount — Preâmbulo Tech</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --green-bg: #dcfce7; --green-text: #166534;
      --yellow-bg: #fef9c3; --yellow-text: #713f12;
      --red-bg: #fee2e2;   --red-text: #991b1b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; }

    /* HEADER */
    .header { background: #0f172a; color: #f8fafc; padding: 18px 28px; display: flex; align-items: baseline; gap: 16px; }
    .header h1 { font-size: 17px; font-weight: 600; }
    .header span { font-size: 12px; color: #94a3b8; }

    /* LAYOUT */
    .page { max-width: 1360px; margin: 0 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

    /* SUMMARY BAR */
    .summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
    .summary-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .summary-card .nums { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
    .summary-card .big { font-size: 26px; font-weight: 700; }
    .summary-card .arrow { font-size: 18px; color: var(--text-muted); }
    .summary-card .needed { font-size: 20px; font-weight: 700; }
    .summary-card .delta { font-size: 12px; font-weight: 600; margin-top: 4px; }
    .ok { color: #16a34a; } .warn { color: #d97706; } .crit { color: #dc2626; }

    /* PRODUCT CARD */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .card-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .card-head h2 { font-size: 14px; font-weight: 600; }
    .card-head .people { font-size: 11px; color: var(--text-muted); }
    .backlog-pill { margin-left: auto; font-size: 11px; background: #e2e8f0; padding: 2px 8px; border-radius: 10px; color: var(--text-muted); white-space: nowrap; }

    /* CONTROLS */
    .controls { display: flex; gap: 20px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); background: #fafafa; flex-wrap: wrap; }
    .ctrl { display: flex; align-items: center; gap: 6px; }
    .ctrl label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .ctrl input[type=number] { width: 58px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; text-align: center; }
    .ctrl input[type=number]:focus { outline: 2px solid #3b82f6; border-color: transparent; }
    .cap-label { margin-left: auto; font-size: 12px; color: var(--text-muted); }
    .cap-label strong { color: var(--text); }

    /* NOTE */
    .shared-note { font-size: 11px; color: #92400e; background: #fffbeb; padding: 5px 16px; border-bottom: 1px solid #fde68a; }

    /* TABLE */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead th { padding: 7px 12px; font-weight: 500; color: var(--text-muted); background: #f8fafc; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
    thead th:first-child { text-align: left; }
    tbody td { padding: 6px 12px; text-align: right; border-bottom: 1px solid #f1f5f9; }
    tbody td:first-child { text-align: left; font-weight: 500; color: var(--text); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f8fafc; }
    .section-row td { background: #f1f5f9; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #94a3b8; padding: 4px 12px; }

    /* EDITABLE ENTRY */
    .entry-inp { width: 54px; padding: 3px 5px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; font-size: 12px; background: #fffbeb; }
    .entry-inp:focus { outline: 2px solid #3b82f6; border-color: transparent; }

    /* BADGES */
    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .g  { background: var(--green-bg);  color: var(--green-text); }
    .y  { background: var(--yellow-bg); color: var(--yellow-text); }
    .r  { background: var(--red-bg);    color: var(--red-text); }
    .hc-ok   { color: #16a34a; font-weight: 700; }
    .hc-warn { color: #d97706; font-weight: 700; }
    .hc-crit { color: #dc2626; font-weight: 700; }

    /* FOOTER STRIP */
    .card-foot { display: flex; gap: 20px; padding: 10px 16px; background: #f8fafc; border-top: 1px solid var(--border); flex-wrap: wrap; font-size: 12px; }
    .foot-item strong { font-weight: 600; }
  </style>
</head>
<body>

<div class="header">
  <h1>Simulador de Headcount — Implementação</h1>
  <span>Preâmbulo Tech · Base: 16/10/2026 · Meta: encerrar projetos em até 30 dias</span>
</div>

<div class="page">
  <div class="summary-bar" id="summary-bar"></div>
  <div id="products"></div>
</div>

<script>
/* ─── DADOS ──────────────────────────────────────────────────── */

const MONTHS = [
  // 2026 restante
  { key:'2026-10', label:'Out/26',  year:'2026', partial:true },
  { key:'2026-11', label:'Nov/26',  year:'2026' },
  { key:'2026-12', label:'Dez/26',  year:'2026' },
  // 2027
  { key:'2027-01', label:'Jan/27',  year:'2027' },
  { key:'2027-02', label:'Fev/27',  year:'2027' },
  { key:'2027-03', label:'Mar/27',  year:'2027' },
  { key:'2027-04', label:'Abr/27',  year:'2027' },
  { key:'2027-05', label:'Mai/27',  year:'2027' },
  { key:'2027-06', label:'Jun/27',  year:'2027' },
  { key:'2027-07', label:'Jul/27',  year:'2027' },
  { key:'2027-08', label:'Ago/27',  year:'2027' },
  { key:'2027-09', label:'Set/27',  year:'2027' },
  { key:'2027-10', label:'Out/27',  year:'2027' },
  { key:'2027-11', label:'Nov/27',  year:'2027' },
  { key:'2027-12', label:'Dez/27',  year:'2027' },
];

// Estado reativo
const S = {
  products: {
    'CPJ-3C': {
      color:      '#4f46e5',
      headcount:  4,
      throughput: 4,  // projetos concluídos por pessoa/mês — base histórica: ~4 (pico 13 em abr/jun com 1-2 pessoas)
      backlog:    18,
      implementers: 'Claudine · Anna Flora · Matteus · Priscila',
      sharedNote: 'Matteus, Claudine e Priscila também atuam em Office ADV — alocação orgânica, sem divisão fixa.',
      entries: {
        // 2026 restante — estimativa (editável)
        '2026-10': 5,  '2026-11': 8,  '2026-12': 5,
        // 2027 — projeção comercial (contratos necessários, arredondado)
        '2027-01': 4,  '2027-02': 10, '2027-03': 13,
        '2027-04': 12, '2027-05': 11, '2027-06': 13,
        '2027-07': 9,  '2027-08': 13, '2027-09': 12,
        '2027-10': 11, '2027-11': 12, '2027-12': 6,
      }
    },
    'Office ADV': {
      color:      '#059669',
      headcount:  5,
      throughput: 9,  // base histórica: ~11/pessoa nas principais (ago) + dedução parcial dos 3 compartilhados → média de 9/pessoa
      backlog:    40,
      implementers: 'Bárbara · Lara · Matteus · Claudine · Priscila',
      sharedNote: 'Matteus, Claudine e Priscila também atuam em CPJ-3C — alocação orgânica, sem divisão fixa.',
      entries: {
        // 2026 restante — estimativa (editável)
        '2026-10': 10, '2026-11': 22, '2026-12': 14,
        // 2027 — projeção comercial
        '2027-01': 27, '2027-02': 33, '2027-03': 58,
        '2027-04': 55, '2027-05': 52, '2027-06': 58,
        '2027-07': 29, '2027-08': 58, '2027-09': 55,
        '2027-10': 52, '2027-11': 50, '2027-12': 16,
      }
    },
    'CPJ-Cobrança': {
      color:      '#d97706',
      headcount:  1,
      throughput: 2,  // base histórica: 1-4 fechamentos/mês com 1 implementador
      backlog:    8,
      implementers: 'Thiago',
      sharedNote: null,
      entries: {
        // 2026 restante
        '2026-10': 1, '2026-11': 1, '2026-12': 1,
        // 2027 — mínimo 1 venda/mês conforme projeção comercial
        '2027-01': 1, '2027-02': 1, '2027-03': 1,
        '2027-04': 1, '2027-05': 1, '2027-06': 1,
        '2027-07': 1, '2027-08': 1, '2027-09': 1,
        '2027-10': 1, '2027-11': 1, '2027-12': 1,
      }
    }
  }
};

/* ─── SIMULAÇÃO ─────────────────────────────────────────────── */

function simulate(name) {
  const p = S.products[name];
  const rows = [];
  let stock = p.backlog;

  for (const m of MONTHS) {
    const entries   = (p.entries[m.key] || 0);
    const capacity  = p.headcount * p.throughput;
    const stockIn   = stock + entries;
    const done      = Math.min(stockIn, capacity);
    const stockOut  = stockIn - done;
    const avgDays   = capacity > 0 ? Math.round((stockIn / capacity) * 30) : 9999;
    const hcMin     = capacity > 0 ? Math.ceil(stockIn / p.throughput) : '—';
    rows.push({ m, entries, stockIn, capacity, done, stockOut, avgDays, hcMin });
    stock = stockOut;
  }
  return rows;
}

/* ─── UTILITÁRIOS ───────────────────────────────────────────── */

function timeBadge(d) {
  if (d >= 9999) return '<span class="badge r">∞</span>';
  const cls = d <= 30 ? 'g' : d <= 60 ? 'y' : 'r';
  return `<span class="badge ${cls}">${d}d</span>`;
}

function hcCell(needed, current) {
  if (needed === '—') return '—';
  if (needed <= current)     return `<span class="hc-ok">${needed}</span>`;
  if (needed === current + 1) return `<span class="hc-warn">${needed}</span>`;
  return `<span class="hc-crit">${needed}</span>`;
}

function peek2027(rows, fn) {
  return rows.filter(r => r.m.year === '2027').map(fn);
}

/* ─── RENDER ────────────────────────────────────────────────── */

function renderSummary() {
  const html = Object.keys(S.products).map(name => {
    const p = S.products[name];
    const rows = simulate(name);
    const r27 = rows.filter(r => r.m.year === '2027');
    const maxNeeded = Math.max(...r27.map(r => r.hcMin === '—' ? 0 : r.hcMin));
    const delta = maxNeeded - p.headcount;
    const cls = delta > 0 ? 'crit' : delta === 0 ? 'warn' : 'ok';
    const deltaLabel = delta > 0 ? `▲ ${delta} a contratar` : delta < 0 ? `▼ ${Math.abs(delta)} de folga` : '= exato';
    return `
      <div class="summary-card">
        <div class="label" style="color:${p.color}">${name}</div>
        <div class="nums">
          <span class="big">${p.headcount}</span>
          <span class="arrow">→</span>
          <span class="needed ${cls}">${maxNeeded}</span>
          <span style="font-size:11px;color:var(--text-muted)">pico 2027</span>
        </div>
        <div class="delta ${cls}">${deltaLabel}</div>
      </div>`;
  }).join('');
  document.getElementById('summary-bar').innerHTML = html;
}

function renderProduct(name) {
  const p = S.products[name];
  const rows = simulate(name);
  const r27 = rows.filter(r => r.m.year === '2027');
  const avgDays27 = Math.round(r27.reduce((s,r) => s + Math.min(r.avgDays, 300), 0) / r27.length);
  const maxNeeded = Math.max(...r27.map(r => r.hcMin === '—' ? 0 : r.hcMin));
  const delta = maxNeeded - p.headcount;

  let prevYear = '';
  const tRows = rows.map(r => {
    const sep = r.m.year !== prevYear
      ? `<tr class="section-row"><td colspan="8">${r.m.year === '2026' ? '2026 — restante do ano' : '2027'}</td></tr>`
      : '';
    prevYear = r.m.year;
    const partialTip = r.m.partial ? ' <span style="font-size:10px;color:#94a3b8">(15 dias)</span>' : '';
    return `${sep}
      <tr>
        <td>${r.m.label}${partialTip}</td>
        <td><input class="entry-inp" type="number" min="0" value="${r.entries}"
              oninput="setEntry('${name}','${r.m.key}',this.value)"></td>
        <td>${r.stockIn}</td>
        <td>${r.capacity}</td>
        <td>${r.done}</td>
        <td>${r.stockOut}</td>
        <td>${timeBadge(r.avgDays)}</td>
        <td>${hcCell(r.hcMin, p.headcount)}</td>
      </tr>`;
  }).join('');

  const deltaLabel = delta > 0
    ? `<span class="crit">▲ ${delta} a contratar para atingir a meta</span>`
    : `<span class="ok">✓ headcount suficiente no pico</span>`;

  return `
    <div class="card" id="card-${name.replace(/\W/g,'_')}">
      <div class="card-head">
        <div class="dot" style="background:${p.color}"></div>
        <div>
          <h2>${name}</h2>
          <div class="people">${p.implementers}</div>
        </div>
        <div class="backlog-pill">Estoque atual: ${p.backlog} projetos</div>
      </div>
      <div class="controls">
        <div class="ctrl">
          <label>Implementadores</label>
          <input type="number" min="0" max="30" value="${p.headcount}"
                 oninput="setConf('${name}','headcount',this.value)">
        </div>
        <div class="ctrl">
          <label>Projetos/pessoa/mês</label>
          <input type="number" min="1" max="50" value="${p.throughput}"
                 oninput="setConf('${name}','throughput',this.value)">
        </div>
        <div class="cap-label">Capacidade: <strong>${p.headcount * p.throughput} projetos/mês</strong></div>
      </div>
      ${p.sharedNote ? `<div class="shared-note">${p.sharedNote}</div>` : ''}
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th style="text-align:left">Mês</th>
              <th>Entradas</th>
              <th>Est. início</th>
              <th>Capacidade</th>
              <th>Concluídos</th>
              <th>Est. final</th>
              <th>Tempo médio</th>
              <th>HC mínimo</th>
            </tr>
          </thead>
          <tbody>${tRows}</tbody>
        </table>
      </div>
      <div class="card-foot">
        <div class="foot-item">Média de dias em 2027: <strong>${avgDays27}d</strong></div>
        <div class="foot-item">HC máximo necessário 2027: <strong>${maxNeeded}</strong> vs <strong>${p.headcount} atuais</strong> — ${deltaLabel}</div>
      </div>
    </div>`;
}

function rerender() {
  renderSummary();
  document.getElementById('products').innerHTML =
    Object.keys(S.products).map(renderProduct).join('');
}

/* ─── INTERAÇÃO ─────────────────────────────────────────────── */

function setEntry(name, key, val) {
  S.products[name].entries[key] = parseInt(val) || 0;
  rerender();
  // Restore focus on the input that was being edited
  // (rerender substitutes the DOM, so we use a small trick)
  requestAnimationFrame(() => {
    const inputs = document.querySelectorAll(`#card-${name.replace(/\W/g,'_')} .entry-inp`);
    const monthKeys = Object.keys(S.products[name].entries);
    const idx = MONTHS.findIndex(m => m.key === key);
    if (inputs[idx]) inputs[idx].focus();
  });
}

function setConf(name, field, val) {
  S.products[name][field] = parseInt(val) || 0;
  rerender();
}

rerender();
</script>
</body>
</html>
